<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QR Kantha</title>
    <meta name="description" content="Scan and create QR codes, including UPI payment QRs split into smaller parts." />
    <meta name="theme-color" content="#f4f6fb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Apply the saved/system theme before React loads, so there is no light flash in dark mode -->
    <script>
      try {
        var m = localStorage.getItem("qr_theme");
        m = m ? JSON.parse(m) : "system";
        var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (localStorage.getItem("qr_sidebar_collapsed") === "true") document.documentElement.dataset.sidebar = "collapsed";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
